name: RSS Feed Update

on:
  # 毎日中国時間11:30に実行（UTC = 03:30）
  schedule:
    - cron: '30 3 * * *'
  # 手動実行も可能にする
  workflow_dispatch:

# 🆕 権限設定（重要！）
permissions:
  contents: write  # リポジトリの内容を書き込む権限

jobs:
  update-rss:
    runs-on: ubuntu-latest
    
    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4
      with:
        # 🆕 トークンを明示的に設定（推奨）
        token: ${{ secrets.GITHUB_TOKEN }}
        # 全履歴を取得（必要に応じて）
        fetch-depth: 0
    
    - name: Pythonをセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 依存パッケージをインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Chromeをインストール
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
    
    - name: スクリプトを実行
      run: |
        python generate_rss.py
    
    - name: 変更をコミットしてプッシュ
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add rss.xml
        # 変更がある場合のみコミット
        git diff --staged --quiet || git commit -m "🔄 RSSフィードを自動更新 ($(date '+%Y-%m-%d %H:%M'))"
        git push
      # 🆕 エラーが発生してもワークフローを失敗させない（オプション）
      continue-on-error: false
